name: Verify and release Windows build

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        default: 1.1.2
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore DirectoryStructureGenerator.PresetManager.csproj
      - name: Clean
        run: dotnet clean DirectoryStructureGenerator.PresetManager.csproj -c Release
      - name: Build
        run: dotnet build DirectoryStructureGenerator.PresetManager.csproj -c Release --no-restore
      - name: Publish self-contained Windows x64 app
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: dotnet publish DirectoryStructureGenerator.PresetManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish/win-x64
      - name: Package and hash
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $version = if ("${{ inputs.version }}") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".Substring(1) }
          $zip = "DirectoryStructureGenerator.PresetManager_v${version}_win-x64.zip"
          Copy-Item README.md publish/win-x64/README.md
          Copy-Item LICENSE publish/win-x64/LICENSE
          Copy-Item PresetManager_ProductIcon.ico publish/win-x64/PresetManager_ProductIcon.ico
          Compress-Archive -Path publish/win-x64/* -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$zip.sha256.txt" -Encoding utf8 -Value "$zip  $hash"
          Set-Content -LiteralPath SHA256SUMS.txt -Encoding utf8 -Value "$hash  $zip"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = if ("${{ inputs.version }}") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".Substring(1) }
          $tag = "v${version}"
          $zip = "DirectoryStructureGenerator.PresetManager_v${version}_win-x64.zip"
          gh release create "$tag" $zip "$zip.sha256.txt" SHA256SUMS.txt `
            --title "Directory Structure Generator - Preset Manager ${version}" `
            --notes-file "RELEASE_NOTES_v${version}.md"
